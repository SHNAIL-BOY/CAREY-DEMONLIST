<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Carey-Demonlist</title>
  <style>
    :root {
      --bg-color: #121318;
      --card-bg: #1c1e24;
      --accent-color: #2AFA8A;
      --text-color: #ffffff;
      --subtext-color: #a0a5b5;
      --border-color: #2e323d;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 2.5rem;
      margin: 0;
      color: var(--accent-color);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .level-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      display: flex;
      gap: 20px;
      align-items: flex-start;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      border-left: 5px solid var(--accent-color);
    }

    .rank {
      font-size: 2rem;
      font-weight: bold;
      min-width: 45px;
      text-align: center;
      color: var(--accent-color);
      margin-top: 5px;
    }

    .details {
      flex: 1;
    }

    .details h2 {
      margin: 0 0 5px 0;
      font-size: 1.4rem;
    }

    .details p {
      margin: 3px 0;
      color: var(--subtext-color);
      font-size: 0.9rem;
    }

    .video-btn {
      display: inline-block;
      margin-top: 8px;
      margin-bottom: 10px;
      padding: 6px 12px;
      background-color: var(--accent-color);
      color: white;
      text-decoration: none;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .video-btn:hover {
      opacity: 0.9;
    }

    /* Expandable Leaderboard Styles */
    details.leaderboard {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border-color);
    }

    details.leaderboard summary {
      font-weight: bold;
      font-size: 0.95rem;
      color: var(--text-color);
      cursor: pointer;
      user-select: none;
      padding: 4px 0;
      transition: color 0.2s;
    }

    details.leaderboard summary:hover {
      color: var(--accent-color);
    }

    .record-list {
      list-style: none;
      padding: 0;
      margin: 10px 0 0 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .record-item {
      display: flex;
      justify-content: space-between;
      font-size: 0.88rem;
      background: rgba(0, 0, 0, 0.2);
      padding: 6px 10px;
      border-radius: 4px;
    }

    .record-item a {
      color: #3b82f6;
      text-decoration: none;
      font-weight: bold;
    }

    .record-item a:hover {
      text-decoration: underline;
    }

    .percent {
      color: var(--accent-color);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <h1>Demonlist</h1>
    <p>Carey Baptist Forrestdale Demonlist</p>
    <p>Made by SHNAILBOY :D</p>
  </header>

  <main class="container" id="demon-list">
    </main>

  <script>
    async function loadDemonlist() {
      const listContainer = document.getElementById('demon-list');
      
      try {
        const response = await fetch('levels.json');
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        const levels = await response.json();
        renderLevels(levels);

      } catch (error) {
        console.error("Error loading levels.json:", error);
        listContainer.innerHTML = `
          <div style="background: #2a1517; color: #ff6b6b; padding: 20px; border-radius: 8px; border: 1px solid #ff3366; text-align: center;">
            <h3>⚠️ Unable to load levels.json</h3>
            <p><strong>Reason:</strong> ${error.message}</p>
          </div>
        `;
      }
    }

    function renderLevels(levels) {
      const listContainer = document.getElementById('demon-list');
      listContainer.innerHTML = '';

      levels.forEach((level, index) => {
        const card = document.createElement('div');
        card.className = 'level-card';

        const recordCount = level.records ? level.records.length : 0;
        let recordsHTML = '<p style="color: var(--subtext-color); font-size: 0.85rem; margin-top: 8px;">No victors yet.</p>';
        
        if (recordCount > 0) {
          recordsHTML = `<ul class="record-list">` + 
            level.records.map(r => `
              <li class="record-item">
                <span>
                  <a href="${r.video}" target="_blank">${r.user}</a>
                </span>
                <span class="percent">${r.percent}%</span>
              </li>
            `).join('') + 
          `</ul>`;
        }

        card.innerHTML = `
          <div class="rank">#${index + 1}</div>
          <div class="details">
            <h2>${level.name}</h2>
            <p><strong>Publisher/Creator:</strong> ${level.publisher}</p>
            <p><strong>Verifier:</strong> ${level.verifier}</p>
            <p><strong>Level ID:</strong> ${level.levelID}</p>
            ${level.video ? `<a href="${level.video}" target="_blank" class="video-btn">Watch Verification</a>` : ''}

            <details class="leaderboard">
              <summary>Records / Victors (${recordCount})</summary>
              ${recordsHTML}
            </details>
          </div>
        `;

        listContainer.appendChild(card);
      });
    }

    loadDemonlist();
  </script>
</body>
</html>
