<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Carey-baptist GD-Demonlist</title>
  <style>
    :root {
      --bg-color: #121318;
      --card-bg: #1c1e24;
      --accent-color: #ff3366;
      --text-color: #ffffff;
      --subtext-color: #a0a5b5;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 2.5rem;
      margin: 0;
      color: var(--accent-color);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .level-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      display: flex;
      gap: 20px;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      border-left: 5px solid var(--accent-color);
    }

    .rank {
      font-size: 2rem;
      font-weight: bold;
      min-width: 45px;
      text-align: center;
      color: var(--accent-color);
    }

    .details {
      flex: 1;
    }

    .details h2 {
      margin: 0 0 5px 0;
      font-size: 1.4rem;
    }

    .details p {
      margin: 3px 0;
      color: var(--subtext-color);
      font-size: 0.9rem;
    }

    .video-btn {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 12px;
      background-color: var(--accent-color);
      color: white;
      text-decoration: none;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .video-btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <header>
    <h1>Demonlist</h1>
    <p>Top Hardest Geometry Dash Levels</p>
  </header>

  <main class="container" id="demon-list">
    </main>

  <script>
    async function loadDemonlist() {
      try {
        const response = await fetch('levels.json');
        const levels = await response.json();
        const listContainer = document.getElementById('demon-list');

        listContainer.innerHTML = ''; // Clear container

        levels.forEach((level, index) => {
          const card = document.createElement('div');
          card.className = 'level-card';

          card.innerHTML = `
            <div class="rank">#${index + 1}</div>
            <div class="details">
              <h2>${level.name}</h2>
              <p><strong>Publisher/Creator:</strong> ${level.publisher}</p>
              <p><strong>Verifier:</strong> ${level.verifier}</p>
              <p><strong>Level ID:</strong> ${level.levelID}</p>
              ${level.video ? `<a href="${level.video}" target="_blank" class="video-btn">Watch Verification</a>` : ''}
            </div>
          `;

          listContainer.appendChild(card);
        });
      } catch (error) {
        console.error("Error loading levels.json:", error);
      }
    }

    loadDemonlist();
  </script>
</body>
</html>
