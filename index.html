<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Carey-Demonlist</title>
  <style>
    :root {
      --bg-color: #121318;
      --card-bg: #1c1e24;
      --accent-color: #2AFA8A;
      --text-color: #ffffff;
      --subtext-color: #a0a5b5;
      --border-color: #2e323d;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    /* Top Right Leaderboard Box Container */
    .nav-container {
      position: absolute;
      top: 20px;
      right: 20px;
    }

    /* Toggle Button */
    .menu-btn {
      background-color: var(--card-bg);
      color: var(--accent-color);
      border: 1px solid var(--border-color);
      font-size: 0.95rem;
      font-weight: bold;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .menu-btn:hover {
      background-color: var(--border-color);
    }

    .menu-btn:active {
      transform: scale(0.98);
    }

    /* Collapsible Leaderboard Popup Box */
    .leaderboard-popup {
      display: none; /* Hidden by default */
      position: absolute;
      right: 0;
      top: 45px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      width: 310px;
      z-index: 1000;
      padding: 16px;
      box-sizing: border-box;
    }

    .leaderboard-popup.show {
      display: block;
    }

    .popup-title {
      margin: 0 0 12px 0;
      font-size: 1.1rem;
      color: var(--accent-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    .popup-title span {
      font-size: 0.75rem;
      color: var(--subtext-color);
      font-weight: normal;
    }

    /* Mini Leaderboard List */
    .top-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 350px;
      overflow-y: auto;
    }

    .top-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.25);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.88rem;
    }

    .top-item .player-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .top-item .rank-badge {
      color: var(--accent-color);
      font-weight: bold;
      min-width: 24px;
    }

    .top-item .player-name {
      font-weight: 600;
    }

    .top-item .player-stats {
      text-align: right;
    }

    .top-item .points {
      color: var(--accent-color);
      font-weight: bold;
      font-size: 0.85rem;
    }

    .top-item .demons {
      font-size: 0.72rem;
      color: var(--subtext-color);
      display: block;
    }

    header {
      text-align: center;
      margin-top: 10px;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 2.5rem;
      margin: 0;
      color: var(--accent-color);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .level-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      display: flex;
      gap: 20px;
      align-items: flex-start;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      border-left: 5px solid var(--accent-color);
    }

    .card-banner {
      width: 140px;
      height: 80px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .rank {
      font-size: 2rem;
      font-weight: bold;
      min-width: 45px;
      text-align: center;
      color: var(--accent-color);
      margin-top: 5px;
    }

    .details {
      flex: 1;
    }

    .details h2 {
      margin: 0 0 5px 0;
      font-size: 1.4rem;
    }

    .details p {
      margin: 3px 0;
      color: var(--subtext-color);
      font-size: 0.9rem;
    }

    .video-btn {
      display: inline-block;
      margin-top: 8px;
      margin-bottom: 10px;
      padding: 6px 12px;
      background-color: var(--accent-color);
      color: white;
      text-decoration: none;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .video-btn:hover {
      opacity: 0.9;
    }

    details.leaderboard {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border-color);
    }

    details.leaderboard summary {
      font-weight: bold;
      font-size: 0.95rem;
      color: var(--text-color);
      cursor: pointer;
      user-select: none;
      padding: 4px 0;
      transition: color 0.2s;
    }

    details.leaderboard summary:hover {
      color: var(--accent-color);
    }

    .record-list {
      list-style: none;
      padding: 0;
      margin: 10px 0 0 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .record-item {
      display: flex;
      justify-content: space-between;
      font-size: 0.88rem;
      background: rgba(0, 0, 0, 0.2);
      padding: 6px 10px;
      border-radius: 4px;
    }

    .record-item a {
      color: #3b82f6;
      text-decoration: none;
      font-weight: bold;
    }

    .record-item a:hover {
      text-decoration: underline;
    }

    .percent {
      color: var(--accent-color);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="nav-container">
    <button class="menu-btn" id="menuToggle">🏆 Leaderboard</button>
    <div class="leaderboard-popup" id="leaderboardPopup">
      <h3 class="popup-title">
        🏆 Top 10 Players
        <span>Points</span>
      </h3>
      <div id="popup-leaderboard-content"></div>
    </div>
  </div>

  <header>
    <h1>Demonlist</h1>
    <p>Carey Baptist Forrestdale Demonlist</p>
    <p>Made by SHNAILBOY :D</p>
  </header>

  <main class="container">
    <div id="demon-list" class="container"></div>
  </main>

  <script>
    // --- 1. POPUP TOGGLE LOGIC ---
    const menuToggle = document.getElementById('menuToggle');
    const leaderboardPopup = document.getElementById('leaderboardPopup');

    menuToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      leaderboardPopup.classList.toggle('show');
    });

    // Close box when clicking outside of it
    document.addEventListener('click', (e) => {
      if (!leaderboardPopup.contains(e.target) && e.target !== menuToggle) {
        leaderboardPopup.classList.remove('show');
      }
    });

    // --- 2. YOUTUBE THUMBNAIL HELPER ---
    function getYouTubeId(url) {
      if (!url) return null;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    // --- 3. FETCH AND PROCESS DATA ---
    async function loadDemonlist() {
      const listContainer = document.getElementById('demon-list');
      
      try {
        const response = await fetch('levels.json');
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        const levels = await response.json();
        
        renderLevels(levels);
        
        const sortedPlayers = calculateLeaderboard(levels);
        renderTop10Leaderboard(sortedPlayers);

      } catch (error) {
        console.error("Error loading levels.json:", error);
        listContainer.innerHTML = `
          <div style="background: #2a1517; color: #ff6b6b; padding: 20px; border-radius: 8px; border: 1px solid #ff3366; text-align: center;">
            <h3>⚠️ Unable to load levels.json</h3>
            <p><strong>Reason:</strong> ${error.message}</p>
          </div>
        `;
      }
    }

    // --- 4. RENDER DEMON CARDS ---
    function renderLevels(levels) {
      const listContainer = document.getElementById('demon-list');
      listContainer.innerHTML = '';

      levels.forEach((level, index) => {
        const card = document.createElement('div');
        card.className = 'level-card';

        const ytId = getYouTubeId(level.video);
        const thumbHTML = ytId 
          ? `<img class="card-banner" src="https://img.youtube.com/vi/${ytId}/hqdefault.jpg" alt="${level.name}">`
          : '';

        const recordCount = level.records ? level.records.length : 0;
        let recordsHTML = '<p style="color: var(--subtext-color); font-size: 0.85rem; margin-top: 8px;">No victors yet.</p>';
        
        if (recordCount > 0) {
          recordsHTML = `<ul class="record-list">` + 
            level.records.map(r => `
              <li class="record-item">
                <span>
                  ${r.video 
                    ? `<a href="${r.video}" target="_blank">${r.user}</a>` 
                    : `<span>${r.user}</span>`
                  }
                </span>
                <span class="percent">${r.percent}%</span>
              </li>
            `).join('') + 
          `</ul>`;
        }

        card.innerHTML = `
          <div class="rank">#${index + 1}</div>
          ${thumbHTML}
          <div class="details">
            <h2>${level.name}</h2>
            <p><strong>Publisher/Creator:</strong> ${level.publisher}</p>
            <p><strong>Verifier:</strong> ${level.verifier}</p>
            <p><strong>Level ID:</strong> ${level.levelID}</p>
            ${level.video ? `<a href="${level.video}" target="_blank" class="video-btn">Watch Verification</a>` : ''}

            <details class="leaderboard">
              <summary>Records / Victors (${recordCount})</summary>
              ${recordsHTML}
            </details>
          </div>
        `;

        listContainer.appendChild(card);
      });
    }

    // --- 5. CALCULATE SCORES ---
    function calculateLeaderboard(levels) {
      const players = {};

      levels.forEach((level, index) => {
        const maxPoints = Math.max(10, 100 - index * 10);

        if (level.records && Array.isArray(level.records)) {
          level.records.forEach(record => {
            const username = record.user;
            const percent = record.percent || 100;
            const earnedPoints = Math.round((maxPoints * percent) / 100);

            if (!players[username]) {
              players[username] = { name: username, score: 0, completions: 0 };
            }

            players[username].score += earnedPoints;
            if (percent === 100) {
              players[username].completions += 1;
            }
          });
        }
      });

      return Object.values(players).sort((a, b) => b.score - a.score);
    }

    // --- 6. RENDER TOP 10 PLAYERS IN POPUP ---
    function renderTop10Leaderboard(players) {
      const container = document.getElementById('popup-leaderboard-content');

      if (players.length === 0) {
        container.innerHTML = '<p style="text-align:center; color: var(--subtext-color); font-size: 0.85rem;">No victors yet!</p>';
        return;
      }

      // Slice array to show ONLY the Top 10 players
      const top10 = players.slice(0, 10);

      let html = `<ul class="top-list">`;

      top10.forEach((player, index) => {
        html += `
          <li class="top-item">
            <div class="player-info">
              <span class="rank-badge">#${index + 1}</span>
              <span class="player-name">${player.name}</span>
            </div>
            <div class="player-stats">
              <span class="points">${player.score} pts</span>
              <span class="demons">${player.completions} demon${player.completions === 1 ? '' : 's'}</span>
            </div>
          </li>
        `;
      });

      html += `</ul>`;
      container.innerHTML = html;
    }

    loadDemonlist();
  </script>
</body>
</html>
